[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beacon"
dynamic = ["version"]
description = "Beautiful, self-documenting test failure messages — a modern successor to Two Sigma's marbles"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Beacon Contributors" }]
keywords = ["testing", "pytest", "assertions", "debugging", "diagnostics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Debuggers",
    "Typing :: Typed",
]
dependencies = [
    "rich>=13.0.0",
    "executing>=2.0.0",
    "deepdiff>=6.0.0",
    "pytest>=7.0.0",
]

[project.optional-dependencies]
numpy = ["numpy>=1.21.0"]
pandas = ["pandas>=1.3.0"]
llm = ["openai>=1.0.0"]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pytest>=7.0.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.0.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "hatch>=1.12.0",
]

[project.urls]
Homepage = "https://github.com/beacon-testing/beacon"
Documentation = "https://beacon-testing.github.io"
Repository = "https://github.com/beacon-testing/beacon"
Issues = "https://github.com/beacon-testing/beacon/issues"

[project.entry-points."pytest11"]
beacon = "beacon.plugin"

[tool.hatch.version]
path = "src/beacon/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/beacon"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
src = ["src"]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "C4", "SIM", "TCH"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S101"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -v -p pytester"

# Beacon configuration (read by beacon.config)
[tool.beacon]
# Show local variables on failure
show_locals = true
# Max number of local variables to show
max_locals = 10
# Show source code snippet around failing line
show_source = true
# Number of context lines around failing assertion
source_context_lines = 4
# Show rich diff for complex objects
show_diff = true
# Syntax highlighting theme (any pygments theme)
theme = "monokai"
# Enable LLM-powered failure explanation (requires openai extra)
llm_explain = false
# Output formats: "terminal", "json", "html"
output_formats = ["terminal"]
# Filter out these variable name patterns from locals display
locals_exclude_patterns = ["__*", "_pytest*"]
